services:
  - type: web
    name: life-os
    runtime: node
    repo: https://github.com/pauldubrownik-code/life-os
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
